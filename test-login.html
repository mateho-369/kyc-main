<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>Login Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="checkAuth()">Check Auth</button>
    <button onclick="testLogout()">Logout</button>
    <pre id="output"></pre>

    <script>
        const API_URL = 'https://stg.id-manager.com/api';
        const output = document.getElementById('output');

        function log(message) {
            output.textContent += message + '\n';
            console.log(message);
        }

        async function testLogin() {
            try {
                log('Starting login test...');
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });

                const data = await response.json();
                log(`Login response: ${response.status}`);
                log(`Data: ${JSON.stringify(data, null, 2)}`);
                
                // Check cookies
                log(`Cookies: ${document.cookie}`);
                
            } catch (error) {
                log(`Login error: ${error.message}`);
            }
        }

        async function checkAuth() {
            try {
                log('Checking auth status...');
                
                const response = await fetch(`${API_URL}/auth/me`, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    log(`Auth check successful: ${JSON.stringify(data, null, 2)}`);
                } else {
                    log(`Auth check failed: ${response.status}`);
                    const text = await response.text();
                    log(`Response: ${text}`);
                }
                
            } catch (error) {
                log(`Auth check error: ${error.message}`);
            }
        }

        async function testLogout() {
            try {
                log('Logging out...');
                
                const response = await fetch(`${API_URL}/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });

                log(`Logout response: ${response.status}`);
                
            } catch (error) {
                log(`Logout error: ${error.message}`);
            }
        }
    </script>
</body>
</html>
