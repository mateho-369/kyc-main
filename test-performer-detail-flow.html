<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>出演者詳細ページ動作テスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-100">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-6">出演者詳細ページ動作テスト</h1>
        
        <div class="space-y-4">
            <!-- ステップ1: ログイン -->
            <div class="border p-4 rounded">
                <h2 class="font-bold mb-2">ステップ1: ログイン</h2>
                <input type="email" id="email" placeholder="メールアドレス" class="border p-2 mr-2">
                <input type="password" id="password" placeholder="パスワード" class="border p-2 mr-2">
                <button onclick="login()" class="bg-blue-600 text-white px-4 py-2 rounded">
                    ログイン
                </button>
            </div>
            
            <!-- ステップ2: 認証状態確認 -->
            <div class="border p-4 rounded">
                <h2 class="font-bold mb-2">ステップ2: 認証状態確認</h2>
                <button onclick="checkAuth()" class="bg-green-600 text-white px-4 py-2 rounded">
                    認証状態を確認
                </button>
            </div>
            
            <!-- ステップ3: 出演者詳細取得 -->
            <div class="border p-4 rounded">
                <h2 class="font-bold mb-2">ステップ3: 出演者詳細取得</h2>
                <button onclick="getPerformerDetail()" class="bg-purple-600 text-white px-4 py-2 rounded">
                    出演者詳細を取得 (ID: 1755606755946)
                </button>
            </div>
            
            <!-- 結果表示 -->
            <div id="result" class="mt-4 p-4 bg-gray-100 rounded">
                <h2 class="font-bold mb-2">結果:</h2>
                <pre id="resultContent" class="whitespace-pre-wrap text-sm"></pre>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://stg.id-manager.com';
        let authToken = null;
        
        const showResult = (content) => {
            document.getElementById('resultContent').textContent = 
                typeof content === 'object' ? JSON.stringify(content, null, 2) : content;
        };
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showResult('メールアドレスとパスワードを入力してください');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                showResult(`ログイン結果: ${response.status}\n${JSON.stringify(data, null, 2)}`);
                
                if (response.ok && data.token) {
                    authToken = data.token;
                }
            } catch (error) {
                showResult(`ログインエラー: ${error.message}`);
            }
        }
        
        async function checkAuth() {
            try {
                // /auth/me と /api/auth/me の両方をテスト
                const results = [];
                
                // Test 1: /auth/me
                const authMeResponse = await fetch(`${API_URL}/auth/me`, {
                    credentials: 'include',
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                
                results.push(`[/auth/me] Status: ${authMeResponse.status}`);
                if (authMeResponse.ok) {
                    const data = await authMeResponse.json();
                    results.push(`Response: ${JSON.stringify(data, null, 2)}`);
                }
                
                // Test 2: /api/auth/me
                const apiAuthMeResponse = await fetch(`${API_URL}/api/auth/me`, {
                    credentials: 'include',
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                
                results.push(`\n[/api/auth/me] Status: ${apiAuthMeResponse.status}`);
                if (apiAuthMeResponse.ok) {
                    const data = await apiAuthMeResponse.json();
                    results.push(`Response: ${JSON.stringify(data, null, 2)}`);
                }
                
                showResult(results.join('\n'));
            } catch (error) {
                showResult(`認証確認エラー: ${error.message}`);
            }
        }
        
        async function getPerformerDetail() {
            try {
                const response = await fetch(`${API_URL}/api/performers/1755606755946`, {
                    credentials: 'include',
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                
                let result = `出演者詳細API: ${response.status} ${response.statusText}\n\n`;
                
                if (response.ok) {
                    const data = await response.json();
                    result += JSON.stringify(data, null, 2);
                } else {
                    const errorText = await response.text();
                    result += `エラー: ${errorText}`;
                }
                
                showResult(result);
            } catch (error) {
                showResult(`出演者詳細取得エラー: ${error.message}`);
            }
        }
    </script>
</body>
</html>
