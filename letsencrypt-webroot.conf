# Let's Encrypt webroot認証用の一時設定
server {
    listen 80;
    server_name stg.id-manager.com;
    
    # Let's Encrypt認証用
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    
    # その他のリクエストはHTTPSにリダイレクト
    location / {
        return 301 https://$server_name$request_uri;
    }
}
