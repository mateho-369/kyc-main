<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>エラー診断ページ</title>
</head>
<body>
    <h1>Sharegram KYC エラー診断</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        // APIアクセステスト
        fetch('https://stg.id-manager.com/api/health')
            .then(res => res.json())
            .then(data => {
                results.innerHTML += '<p>✅ API接続成功: ' + JSON.stringify(data) + '</p>';
            })
            .catch(err => {
                results.innerHTML += '<p>❌ API接続エラー: ' + err.message + '</p>';
            });
            
        // JavaScriptファイル読み込みテスト
        const script = document.createElement('script');
        script.src = 'https://stg.id-manager.com/static/js/main.7d4f3026.js';
        script.onload = () => {
            results.innerHTML += '<p>✅ JavaScriptファイル読み込み成功</p>';
        };
        script.onerror = () => {
            results.innerHTML += '<p>❌ JavaScriptファイル読み込みエラー</p>';
        };
        document.head.appendChild(script);
        
        // エラーハンドラー
        window.onerror = function(msg, url, line, col, error) {
            results.innerHTML += '<p>❌ JavaScript実行エラー: ' + msg + ' at line ' + line + '</p>';
            results.innerHTML += '<p>エラー詳細: ' + (error ? error.stack : 'N/A') + '</p>';
            return true;
        };
    </script>
</body>
</html>
