<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ファイル入力テスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <h1 class="text-2xl mb-4">ファイル入力テスト</h1>
    
    <div class="space-y-4">
        <!-- テスト1: 基本的なファイル入力 -->
        <div class="border p-4">
            <h2 class="font-bold">テスト1: 基本的なファイル入力</h2>
            <input type="file" id="test1" />
        </div>

        <!-- テスト2: sr-onlyクラス付き -->
        <div class="border p-4">
            <h2 class="font-bold">テスト2: sr-onlyクラス付き（現在の実装）</h2>
            <label class="cursor-pointer bg-green-600 text-white px-4 py-2 rounded">
                <span>ファイルを選択</span>
                <input type="file" class="sr-only" id="test2" />
            </label>
        </div>

        <!-- テスト3: display:none -->
        <div class="border p-4">
            <h2 class="font-bold">テスト3: display:none</h2>
            <label class="cursor-pointer bg-blue-600 text-white px-4 py-2 rounded">
                <span>ファイルを選択</span>
                <input type="file" style="display:none" id="test3" />
            </label>
        </div>

        <!-- テスト4: opacity:0 -->
        <div class="border p-4">
            <h2 class="font-bold">テスト4: opacity:0</h2>
            <label class="cursor-pointer bg-purple-600 text-white px-4 py-2 rounded relative">
                <span>ファイルを選択</span>
                <input type="file" style="opacity:0;position:absolute;left:0;top:0;width:100%;height:100%" id="test4" />
            </label>
        </div>

        <!-- テスト5: JavaScriptクリック -->
        <div class="border p-4">
            <h2 class="font-bold">テスト5: JavaScriptでクリック</h2>
            <input type="file" id="test5" style="display:none" />
            <button onclick="document.getElementById('test5').click()" class="bg-red-600 text-white px-4 py-2 rounded">
                ファイルを選択（JSクリック）
            </button>
        </div>
    </div>

    <script>
        // すべてのファイル入力の変更を監視
        document.querySelectorAll('input[type="file"]').forEach((input, index) => {
            input.addEventListener('change', (e) => {
                console.log(`テスト${index + 1}: ファイル選択成功`, e.target.files[0]?.name);
                alert(`テスト${index + 1}: ${e.target.files[0]?.name} が選択されました`);
            });
        });
    </script>
</body>
</html>
