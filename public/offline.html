<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c3e50">
    <title>オフライン - Id Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .offline-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 3rem 2rem;
            max-width: 450px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .offline-icon svg {
            width: 100%;
            height: 100%;
        }

        .cloud {
            fill: #e0e0e0;
            animation: float 3s ease-in-out infinite;
        }

        .slash {
            fill: #ef4444;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .description {
            color: #666;
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .status-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            border: 1px solid #e9ecef;
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 0.9rem;
        }

        .status-label {
            color: #666;
        }

        .status-value {
            font-weight: 500;
            color: #333;
        }

        .status-online {
            color: #10b981;
        }

        .status-offline {
            color: #ef4444;
        }

        .actions {
            display: flex;
            gap: 1rem;
            flex-direction: column;
        }

        button {
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #dee2e6;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .cached-pages {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e9ecef;
        }

        .cached-pages h2 {
            font-size: 1.25rem;
            color: #2c3e50;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .cached-list {
            text-align: left;
            list-style: none;
        }

        .cached-item {
            padding: 0.5rem 0;
            color: #666;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cached-icon {
            color: #10b981;
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            .description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <g class="cloud">
                    <path d="M95 50c0-13.255-10.745-24-24-24-8.271 0-15.568 4.188-19.889 10.553C49.486 36.201 47.768 36 46 36c-8.837 0-16 7.163-16 16 0 .336.014.668.036.998C20.617 54.894 14 63.068 14 73c0 11.046 8.954 20 20 20h60c8.284 0 15-6.716 15-15s-6.716-15-15-15c-.336 0-.668.014-.998.036C93.648 57.774 95 52.032 95 50z"/>
                </g>
                <g class="slash">
                    <rect x="55" y="20" width="10" height="80" rx="5" transform="rotate(-45 60 60)"/>
                </g>
            </svg>
        </div>

        <h1>オフラインです</h1>
        
        <p class="description">
            インターネット接続がありません。<br>
            ネットワーク接続を確認してください。
        </p>

        <div class="status-info">
            <div class="status-item">
                <span class="status-label">接続状態</span>
                <span class="status-value status-offline" id="connectionStatus">オフライン</span>
            </div>
            <div class="status-item">
                <span class="status-label">最終アクセス</span>
                <span class="status-value" id="lastAccess">-</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="checkConnectionAndReload()">
                接続を確認して再読み込み
            </button>
            <button class="btn-secondary" onclick="window.history.back()">
                前のページに戻る
            </button>
        </div>

        <div class="cached-pages">
            <h2>📦 キャッシュ済みページ</h2>
            <ul class="cached-list">
                <li class="cached-item">
                    <span class="cached-icon">✓</span>
                    ホームページ
                </li>
                <li class="cached-item">
                    <span class="cached-icon">✓</span>
                    ログインページ
                </li>
                <li class="cached-item">
                    <span class="cached-icon">✓</span>
                    基本的なアセット
                </li>
            </ul>
        </div>
    </div>

    <script>
        // 最終アクセス時刻を表示
        const lastAccess = localStorage.getItem('lastOnlineAccess');
        if (lastAccess) {
            const date = new Date(parseInt(lastAccess));
            document.getElementById('lastAccess').textContent = 
                date.toLocaleDateString('ja-JP') + ' ' + 
                date.toLocaleTimeString('ja-JP');
        }

        // オンライン状態を定期的にチェック
        let isChecking = false;
        
        async function checkConnectionAndReload() {
            if (isChecking) return;
            isChecking = true;

            const button = event.target;
            const originalText = button.textContent;
            button.textContent = '接続を確認中...';
            button.disabled = true;

            try {
                // ネットワーク接続をチェック
                const response = await fetch('/manifest.json', { 
                    method: 'HEAD',
                    cache: 'no-cache'
                });
                
                if (response.ok) {
                    document.getElementById('connectionStatus').textContent = 'オンライン';
                    document.getElementById('connectionStatus').className = 'status-value status-online';
                    button.textContent = '再読み込み中...';
                    
                    // オンラインになったのでページをリロード
                    setTimeout(() => {
                        window.location.reload();
                    }, 500);
                } else {
                    throw new Error('Still offline');
                }
            } catch (error) {
                button.textContent = 'まだオフラインです';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.disabled = false;
                    isChecking = false;
                }, 2000);
            }
        }

        // ネットワーク状態の変化を監視
        window.addEventListener('online', () => {
            document.getElementById('connectionStatus').textContent = 'オンライン';
            document.getElementById('connectionStatus').className = 'status-value status-online';
            
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });

        window.addEventListener('offline', () => {
            document.getElementById('connectionStatus').textContent = 'オフライン';
            document.getElementById('connectionStatus').className = 'status-value status-offline';
        });

        // 初期状態をチェック
        if (navigator.onLine) {
            // オンラインなのにこのページが表示されている場合
            checkConnectionAndReload();
        }
    </script>
</body>
</html>
