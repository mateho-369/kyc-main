<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>POST /performers テスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-100">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-4">POST /performers テスト</h1>
        
        <div class="space-y-4">
            <button onclick="testPost()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                POST /performers をテスト
            </button>
            
            <div id="result" class="mt-4 p-4 bg-gray-100 rounded hidden">
                <h2 class="font-bold mb-2">結果:</h2>
                <pre id="resultContent" class="whitespace-pre-wrap"></pre>
            </div>
        </div>
    </div>

    <script>
        async function testPost() {
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            
            resultDiv.classList.remove('hidden');
            resultContent.textContent = 'テスト中...';
            
            try {
                const response = await fetch('https://stg.id-manager.com/performers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        lastName: 'テスト',
                        firstName: '太郎',
                        lastNameRoman: 'Test',
                        firstNameRoman: 'Taro',
                        test: true
                    })
                });
                
                const data = await response.json();
                
                resultContent.textContent = `Status: ${response.status} ${response.statusText}\n\n` + 
                    JSON.stringify(data, null, 2);
                
                if (response.status === 405) {
                    resultContent.textContent += '\n\n❌ 405エラーが発生しています！';
                } else if (response.ok) {
                    resultContent.textContent += '\n\n✅ 正常に動作しています！';
                }
            } catch (error) {
                resultContent.textContent = `エラー: ${error.message}`;
            }
        }
    </script>
</body>
</html>
