# Let's Encrypt証明書を使用する設定

server {
    listen 443 ssl;
    server_name stg.id-manager.com;

    # Let's Encrypt証明書
    ssl_certificate /etc/letsencrypt/live/stg.id-manager.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stg.id-manager.com/privkey.pem;
    
    # SSL設定（Mozilla推奨）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/stg.id-manager.com/chain.pem;

    # セキュリティヘッダー
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ルートディレクトリ
    root /var/www/safevideo/build;
    index index.html;

    # 統合API v1（ポート5002）
    location /api/v1/ {
        proxy_pass http://127.0.0.1:5002/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Version "v1";
        proxy_cache_bypass $http_upgrade;
        
        # 大きなファイルアップロード対応
        client_max_body_size 50M;
        client_body_buffer_size 50M;
    }

    # 既存API（レガシー、ポート5001）
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 大きなファイルアップロード対応
        client_max_body_size 50M;
        client_body_buffer_size 50M;
    }

    # React Router対応
    location / {
        try_files $uri $uri/ /index.html;
        
        # キャッシュ制御
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 静的ファイルのキャッシュ設定
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPからHTTPSへのリダイレクト
server {
    listen 80;
    server_name stg.id-manager.com;
    
    # Let's Encrypt更新用
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}
