# REVIEW/EDIT before use. Not a complete TLS provisioning/firewall configuration.
# Use an additional default_server rejecting unknown hosts. Never expose Node directly.
server {
    listen 443 ssl;
    server_name kyc.example.invalid;
    ssl_certificate /etc/ssl/kyc/fullchain.pem;
    ssl_certificate_key /etc/ssl/kyc/privkey.pem;
    root /srv/kyc/build;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/(api|auth)(/|$) {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Do not publish document storage or enable unaudited WebSocket upgrades.
    location ^~ /uploads { return 404; }
    location ^~ /ws { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
