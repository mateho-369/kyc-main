# 統合API v1対応設定（既存APIと並行稼働）

server {
    listen 443 ssl;
    server_name stg.id-manager.com;

    # SSL設定
    ssl_certificate /etc/nginx/ssl/stg.id-manager.com.crt;
    ssl_certificate_key /etc/nginx/ssl/stg.id-manager.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # セキュリティヘッダー
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ルートディレクトリ
    root /var/www/safevideo/build;
    index index.html;

    # 統合API v1（ポート5002）
    location /api/v1/ {
        proxy_pass http://127.0.0.1:5002/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Version "v1";
        proxy_cache_bypass $http_upgrade;
        
        # 大きなファイルアップロード対応
        client_max_body_size 50M;
        client_body_buffer_size 50M;
        
        # CORS対応
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-API-Client,X-API-Version,X-Admin-Session,X-Webhook-Signature' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # 既存API（レガシー、ポート5001）
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 大きなファイルアップロード対応
        client_max_body_size 50M;
        client_body_buffer_size 50M;
    }

    # React Router対応
    location / {
        try_files $uri $uri/ /index.html;
        
        # キャッシュ制御
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 静的ファイルのキャッシュ設定
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPからHTTPSへのリダイレクト
server {
    listen 80;
    server_name stg.id-manager.com;
    return 301 https://$server_name$request_uri;
}
